<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>@@title</title>
	<link rel="stylesheet" href="css/libs.min.css">
	<link rel="stylesheet" href="style.css">
</head>

<body class="@@class">

	<header class="header">

		<div class="container">
			<div class="header-row">
				<div class="logo">
					<a href="/"><img src="image/logo.svg" alt="" class="img-fluid"></a>
				</div>

				<nav class="main-menu">
					<ul class="list-unstyled">
						<li><a href="#">Про компанію</a></li>
						<li><a href="#">Продукти</a></li>
						<li><a href="#">Партнерство</a></li>
						<li><a href="#">Фармаконагляд</a></li>
						<li><a href="#">Контакти</a></li>
					</ul>
				</nav>

				<div class="header-search">
					<div class="input-group" id="group-search">
						<input name="search" type="text" value="" class="form-control" placeholder="Пошук..." aria-label="Пошук..." aria-describedby="btn-search">
						<button class="btn btn-outline" type="button" id="btn-search"><img src="image/search-icon.svg" alt="Search"></button>
					</div>
				</div>

				<div class="lang-switch">
					<div class="dropdown">
						<button type="button" class="btn btn-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
							UA
						</button>
						<div class="dropdown-menu">
							<ul class="list-unstyled">
								<li><a href="#">Українска</a></li>
								<li><a href="#">Русский</a></li>
								<li><a href="#">English</a></li>
							</ul>
						</div>
					</div>
				</div>

			</div>
		</div>

	</header>

	<div class="frontpage-video">
		<video playsinline="playsinline" autoplay="autoplay" poster="image/video-poster.jpg" muted="muted" loop="loop">
            <source src="image/video_tekhno.mp4" type="video/mp4">
        </video>
		<div class="video-caption">
			<h2>НАЙКРАЩЕ ЗАРАДИ ЗДОРОВ'Я</h2>
			<p>для насолоди життям</p>
		</div>
	</div>
